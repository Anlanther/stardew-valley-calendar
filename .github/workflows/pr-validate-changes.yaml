name: PR - Validate Changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calendar-app/package-lock.json

      - name: Install dependencies
        working-directory: calendar-app
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: calendar-app
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: calendar-app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: calendar-app
        env:
          CI: true
          HEADLESS: true
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: calendar-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: calendar-app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calendar-app/package-lock.json

      - name: Install dependencies
        working-directory: calendar-app
        run: npm ci

      - name: Run Unit Tests
        working-directory: calendar-app
        run: npm run test -- --ci
